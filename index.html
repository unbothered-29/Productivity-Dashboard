<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="" type="image/x-icon">
    <title>Productivity Dashboard</title>
</head>

<body>
    <div id="main">
        <!-- <nav></nav> -->
        <section class="allElems">
            <div class="todo elem" id="0">
                <img src="https://images.unsplash.com/photo-1518976024611-28bf4b48222e?q=80&w=685&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <h2>To Do List</h2>
            </div>
            <div class="daily elem" id="1">
                <img src="https://plus.unsplash.com/premium_photo-1684377477666-6ada350fd9bb?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <h2>Daily Planner</h2>
            </div>
            <div class="moti elem" id="2">
                <img src="https://plus.unsplash.com/premium_photo-1671599016130-7882dbff302f?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <h2>Motivation</h2>
            </div>
            <div class="pomo elem" id="3">
                <img src="https://images.unsplash.com/photo-1741272871636-07aae425c712?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <h2>Pomo Doro Timer</h2>
            </div>
            <div class="goals elem" id="4">
                <img src="https://plus.unsplash.com/premium_photo-1705583864572-9eae8ac296d1?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
                <h2>Monthly Goals</h2>
            </div>
        </section>

        <section class="fullElem todo-pg">
            <button class="back" id="0">Close</button>
            <h2>Your personalized Task List</h2>
            <div class="todo-container">
                <div class="addtask">
                    <form>
                        <input id="task" type="text" placeholder="Enter Task">
                        <textarea placeholder="Enter Details" name="" id="" cols="30" rows="10"></textarea>
                        <div class="mark-imp">
                            <input type="checkbox" name="" id="check">
                            <label for="check">Mark as Important!</label>
                        </div>
                        <button>Add Task</button>
                    </form>
                </div>
                <div class="alltask">
                    <div class="task">
                        <h5>Commits</h5>
                        <button>Mark as Completed</button>
                        <!-- <button>Delete</button> -->
                    </div>
                    <div class="task">
                        <h5>React Js</h5>
                        <button>Mark as Completed</button>
                        <!-- <button>Delete</button> -->
                    </div>
                    <div class="task">
                        <h5>Project</h5>
                        <button>Mark as Completed</button>
                        <!-- <button>Delete</button> -->
                    </div>

                    <div class="task">
                        <h5>Yt Videos</h5>
                        <button>Mark as Completed</button>
                        <!-- <button>Delete</button> -->
                    </div>

                </div>
        </section>
        <section class="fullElem daily-pg">
            <button class="back" id="1">Close</button>
            <h2>Plan the day to be more Productive</h2>

            <div class="day-planner">

            </div>
        </section>
        <section class="fullElem moti-pg">
            <button class="back" id="2">Close</button>
            <div class="motivation-fullpg">
                <div class="moti-container">
                    <div class="moti-wrapper">
                        <img src="./icons8-quote-100.png" alt="">
                        <div class="moti-1">
                            <h2>Quote of the Day</h2>
                        </div>
                        <div class="moti-2">
                            <h1></h1>
                        </div>
                        <div class="moti-3">
                            <h2></h2>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="fullElem pomo-pg">
            <button class="back" id="3">Close</button>
            <h2>Work With Me!</h2>

            <h4 class="session">Work Session</h4>
            <div class="pomo-timer">
                <h1>25:00</h1>
                <button class="start-timer">Start</button>
                <button class="pause-timer">Pause</button>
                <button class="reset-timer">Reset</button>

            </div>
        </section>
        <section class="fullElem goals-pg">
            <button class="back" id="4">Close</button>
            <h1>Monthly Goals</h1>
        </section>
    </div>
    <script src="script.js"></script>
</body>

</html>
